[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crashloom"
version = "0.1.0"
description = "Local-first Python exception flight recorder, best-effort secret-aware state inspector, crash fingerprinting, flight comparison, and pytest reproducer templates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CrashLoom Maintainers" }]
keywords = ["python", "debugging", "exception-handling", "traceback", "crash-reporting", "post-mortem-debugging", "pytest", "test-generation", "flight-recorder", "sqlite", "secret-redaction", "developer-tools", "observability", "debugger", "ast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed"
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "ruff>=0.4.0", "mypy>=1.8.0", "bandit>=1.7.7"]

[project.scripts]
crashloom = "crashloom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
