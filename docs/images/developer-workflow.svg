<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
<title id="title">CrashLoom debugging workflow</title>
<desc id="desc">Developer installs CrashLoom, runs a Python script, inspects the recorded flight, fixes the code, runs again, compares flights using the Python API, and adapts the generated pytest template.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#13213b"/></linearGradient>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#60a5fa"/></marker>
 <style>
 .h{font:700 30px system-ui,sans-serif;fill:#f8fafc}.sub{font:400 15px system-ui,sans-serif;fill:#b2c6dd}.t{font:700 17px system-ui,sans-serif;fill:#f8fafc}.b{font:400 13px system-ui,sans-serif;fill:#cbd5e1}.code{font:500 12px ui-monospace,monospace;fill:#a5f3fc}.box{fill:#112239;stroke:#34516f;stroke-width:1.5}.edge{fill:none;stroke:#60a5fa;stroke-width:3;marker-end:url(#arr)}
 </style>
</defs>
<rect width="1400" height="560" rx="24" fill="url(#bg)"/><text x="52" y="58" class="h">The developer debugging loop</text><text x="54" y="86" class="sub">Capture one failure, inspect real state, make a fix, and compare what changed.</text>
<g>
 <rect x="52" y="135" width="260" height="145" rx="16" class="box" stroke="#22d3ee"/><circle cx="79" cy="163" r="15" fill="#22d3ee"/><text x="79" y="168" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#07111f">1</text><text x="104" y="168" class="t">Install</text><text x="75" y="203" class="code">python -m pip install -e .</text><text x="75" y="235" class="b">Add the CLI to your environment</text>
 <rect x="364" y="135" width="260" height="145" rx="16" class="box" stroke="#818cf8"/><circle cx="391" cy="163" r="15" fill="#818cf8"/><text x="391" y="168" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#07111f">2</text><text x="416" y="168" class="t">Capture a failure</text><text x="387" y="203" class="code">crashloom run app.py</text><text x="387" y="235" class="b">A flight is saved locally</text>
 <rect x="676" y="135" width="260" height="145" rx="16" class="box" stroke="#fbbf24"/><circle cx="703" cy="163" r="15" fill="#fbbf24"/><text x="703" y="168" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#07111f">3</text><text x="728" y="168" class="t">Inspect the flight</text><text x="699" y="203" class="code">crashloom list</text><text x="699" y="223" class="code">crashloom inspect &lt;id&gt;</text><text x="699" y="250" class="b">Review frame and value context</text>
 <rect x="988" y="135" width="360" height="145" rx="16" class="box" stroke="#34d399"/><circle cx="1015" cy="163" r="15" fill="#34d399"/><text x="1015" y="168" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#07111f">4</text><text x="1040" y="168" class="t">Fix and rerun</text><text x="1011" y="203" class="b">Change the code, run again,</text><text x="1011" y="225" class="b">then compare two FlightRecord objects</text><text x="1011" y="251" class="code">diff_flights(before, after)</text>
 <path d="M312 207 H356 M624 207 H668 M936 207 H980" class="edge"/>
 <path d="M1168 280 V330 H832" class="edge"/>
 <rect x="520" y="330" width="410" height="110" rx="16" fill="#1d2946" stroke="#818cf8" stroke-width="1.5"/><text x="545" y="363" class="t">5 · Build a regression test</text><text x="545" y="390" class="b">Generate a starter template, then edit it to</text><text x="545" y="411" class="b">exercise the real failure condition.</text>
 <path d="M520 385 H458 V280" class="edge" opacity=".65"/>
</g>
<rect x="52" y="473" width="1296" height="49" rx="12" fill="#241d31" stroke="#7c5c9a"/><text x="74" y="503" class="b">Important: the synthesizer creates an editable starting template—not a guaranteed exact reproduction. Review generated code and records before sharing.</text>
</svg>