<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-labelledby="title desc">
<title id="title">Inside a CrashLoom flight record</title>
<desc id="desc">Shows metadata, exception fingerprint, ordered traceback frames, function and source information, serialized arguments and locals, and a security note that redaction is best-effort.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#13203a"/></linearGradient>
 <style>
 .h{font:700 30px system-ui,sans-serif;fill:#f8fafc}.sub{font:400 15px system-ui,sans-serif;fill:#afc3da}.label{font:700 16px system-ui,sans-serif;fill:#f8fafc}.body{font:400 14px system-ui,sans-serif;fill:#cbd5e1}.mono{font:500 14px ui-monospace,monospace;fill:#a5f3fc}.small{font:500 12px system-ui,sans-serif;fill:#94a3b8}
 .panel{fill:#112239;stroke:#35516e;stroke-width:1.4}
 </style>
</defs>
<rect width="1400" height="640" rx="24" fill="url(#bg)"/><text x="52" y="58" class="h">Anatomy of a stored flight</text><text x="54" y="85" class="sub">A flight is structured JSON stored in a local SQLite database—not a serialized copy of the running process.</text>
<rect x="50" y="120" width="1300" height="112" rx="16" class="panel"/><rect x="50" y="120" width="8" height="112" rx="4" fill="#22d3ee"/>
<text x="78" y="153" class="label">Flight metadata</text>
<text x="78" y="183" class="mono">flight_id</text><text x="200" y="183" class="body">fl_a81d…</text><text x="405" y="183" class="mono">timestamp_utc</text><text x="545" y="183" class="body">UTC timestamp</text><text x="780" y="183" class="mono">python_version</text><text x="915" y="183" class="body">3.x</text><text x="1050" y="183" class="mono">platform_info</text><text x="1190" y="183" class="body">OS</text>
<text x="78" y="211" class="mono">exception_type</text><text x="220" y="211" class="body">ZeroDivisionError</text><text x="480" y="211" class="mono">fingerprint</text><text x="590" y="211" class="body">stable grouping key</text><text x="855" y="211" class="mono">command_argv</text><text x="995" y="211" class="body">sanitized arguments</text>
<rect x="50" y="255" width="1300" height="250" rx="16" class="panel"/><rect x="50" y="255" width="8" height="250" rx="4" fill="#818cf8"/>
<text x="78" y="289" class="label">Ordered traceback frames</text><text x="1290" y="289" text-anchor="end" class="small">One object per frame in the exception path</text>
<rect x="78" y="313" width="344" height="164" rx="12" fill="#192d48" stroke="#486182"/><text x="98" y="344" class="label">Frame identity</text><text x="98" y="375" class="mono">filename</text><text x="204" y="375" class="body">app.py</text><text x="98" y="401" class="mono">function_name</text><text x="228" y="401" class="body">calculate_total</text><text x="98" y="427" class="mono">lineno</text><text x="204" y="427" class="body">42</text><text x="98" y="453" class="mono">is_user_code</text><text x="228" y="453" class="body">true / false</text>
<rect x="443" y="313" width="362" height="164" rx="12" fill="#192d48" stroke="#486182"/><text x="463" y="344" class="label">Source context</text><text x="463" y="375" class="mono">source_line</text><text x="463" y="400" class="body">subtotal / len(recipients)</text><text x="463" y="427" class="mono">ast_node_type</text><text x="598" y="427" class="body">Expr / Raise / …</text><text x="463" y="453" class="mono">ast_canonical_expr</text><text x="463" y="472" class="small">Canonical form supports fingerprinting</text>
<rect x="826" y="313" width="494" height="164" rx="12" fill="#192d48" stroke="#486182"/><text x="846" y="344" class="label">Serialized runtime state</text><text x="846" y="375" class="mono">bound_arguments</text><text x="1020" y="375" class="body">function inputs</text><text x="846" y="401" class="mono">local_variables</text><text x="1020" y="401" class="body">values in the frame</text><text x="846" y="427" class="mono">repr_str / type_name</text><text x="1020" y="427" class="body">bounded representation</text><text x="846" y="453" class="mono">redacted / truncated</text><text x="1020" y="453" class="body">safety metadata</text>
<rect x="50" y="530" width="1300" height="74" rx="14" fill="#2b1e2b" stroke="#9f5368" stroke-width="1.3"/>
<text x="76" y="560" font-family="system-ui" font-size="16" font-weight="700" fill="#fda4af">Privacy note</text><text x="76" y="585" class="body">Redaction is best-effort. Values may still expose private data; inspect the actual record before sharing it. No object graph or executable process state is restored.</text>
</svg>