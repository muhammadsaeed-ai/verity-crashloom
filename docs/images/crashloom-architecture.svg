<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">CrashLoom system architecture</title>
<desc id="desc">Python application failures pass through CrashLoom entry points, traceback collection, bounded secret-aware serialization and deterministic fingerprinting, then local SQLite storage feeds inspection, comparison and pytest template generation.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#101b35"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".45"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4fb9f2"/></marker>
  <style>
    .head{font:700 34px ui-sans-serif,system-ui,sans-serif;fill:#f8fafc}.sub{font:400 16px ui-sans-serif,system-ui,sans-serif;fill:#a8bdd6}
    .label{font:700 19px ui-sans-serif,system-ui,sans-serif;fill:#f8fafc}.body{font:400 15px ui-sans-serif,system-ui,sans-serif;fill:#cbd5e1}.small{font:500 13px ui-sans-serif,system-ui,sans-serif;fill:#9fb4ce}
    .panel{fill:#111f35;stroke:#2c4766;stroke-width:1.5}.line{fill:none;stroke:#4fb9f2;stroke-width:3;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1400" height="820" rx="28" fill="url(#bg)"/>
<circle cx="1260" cy="90" r="190" fill="#2563eb" opacity=".07"/><circle cx="120" cy="750" r="210" fill="#06b6d4" opacity=".06"/>
<text x="58" y="70" class="head">CrashLoom · System Architecture</text>
<text x="60" y="103" class="sub">Local-first exception recording · no CrashLoom server or runtime dependency required</text>
<g filter="url(#shadow)">
  <rect x="55" y="155" width="280" height="490" rx="18" class="panel"/>
  <rect x="375" y="155" width="365" height="490" rx="18" class="panel"/>
  <rect x="795" y="290" width="240" height="220" rx="18" fill="#0e2b37" stroke="#247d8d" stroke-width="1.8"/>
  <rect x="1090" y="155" width="255" height="490" rx="18" class="panel"/>
</g>
<rect x="55" y="155" width="280" height="7" rx="4" fill="#38bdf8"/><rect x="375" y="155" width="365" height="7" rx="4" fill="#818cf8"/><rect x="795" y="290" width="240" height="7" rx="4" fill="#2dd4bf"/><rect x="1090" y="155" width="255" height="7" rx="4" fill="#34d399"/>
<text x="80" y="195" class="label">01 · Entry points</text>
<rect x="78" y="220" width="234" height="100" rx="12" fill="#172c47" stroke="#315477"/>
<text x="95" y="251" class="label" font-size="17">CLI runner</text><text x="95" y="278" class="body">crashloom run script.py</text><text x="95" y="300" class="small">Uncaught script errors</text>
<rect x="78" y="337" width="234" height="100" rx="12" fill="#172c47" stroke="#315477"/>
<text x="95" y="368" class="label" font-size="17">Context manager</text><text x="95" y="395" class="body">with capture():</text><text x="95" y="417" class="small">Record + re-raise by default</text>
<rect x="78" y="454" width="234" height="100" rx="12" fill="#172c47" stroke="#315477"/>
<text x="95" y="485" class="label" font-size="17">Function wrapper</text><text x="95" y="512" class="body">@watch</text><text x="95" y="534" class="small">Wrap a failing function</text>
<text x="400" y="195" class="label">02 · Capture pipeline</text>
<rect x="400" y="220" width="315" height="86" rx="12" fill="#1b2947" stroke="#5367a5"/>
<circle cx="425" cy="245" r="12" fill="#818cf8"/><text x="425" y="250" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="700" fill="#0b1220">1</text>
<text x="448" y="249" class="label" font-size="17">Traceback collector</text><text x="420" y="278" class="body">Frames · source lines · locals · args</text>
<rect x="400" y="326" width="315" height="86" rx="12" fill="#153242" stroke="#267d99"/>
<circle cx="425" cy="351" r="12" fill="#22d3ee"/><text x="425" y="356" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="700" fill="#06202c">2</text>
<text x="448" y="355" class="label" font-size="17">Safe serializer</text><text x="420" y="384" class="body">Bounded values · best-effort redaction</text>
<rect x="400" y="432" width="315" height="86" rx="12" fill="#2b2448" stroke="#7661b4"/>
<circle cx="425" cy="457" r="12" fill="#a78bfa"/><text x="425" y="462" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="700" fill="#1d123b">3</text>
<text x="448" y="461" class="label" font-size="17">Fingerprint + record</text><text x="420" y="490" class="body">Exception type + canonical statement</text>
<text x="820" y="330" class="label">03 · Storage</text>
<text x="820" y="368" font-family="ui-monospace,monospace" font-size="18" font-weight="700" fill="#67e8f9">SQLite</text>
<text x="820" y="395" class="body">.crashloom/</text><text x="820" y="417" class="body">flights.db</text>
<path d="M820 440 H1008" stroke="#247d8d" stroke-width="1"/>
<text x="820" y="466" class="small">Local file · no hosted service</text>
<text x="1115" y="195" class="label">04 · Developer tools</text>
<rect x="1115" y="220" width="205" height="84" rx="12" fill="#14352f" stroke="#247d64"/><text x="1133" y="250" class="label" font-size="17">List &amp; inspect</text><text x="1133" y="277" class="body">Stored flight details</text>
<rect x="1115" y="322" width="205" height="84" rx="12" fill="#14352f" stroke="#247d64"/><text x="1133" y="352" class="label" font-size="17">Compare flights</text><text x="1133" y="379" class="body">Arguments + locals</text>
<rect x="1115" y="424" width="205" height="84" rx="12" fill="#14352f" stroke="#247d64"/><text x="1133" y="454" class="label" font-size="17">Pytest template</text><text x="1133" y="481" class="body">Editable starting point</text>
<text x="1115" y="555" class="small">Human review still required</text>
<path d="M335 394 H365 V263 H395" class="line"/><path d="M557 306 V321" class="line"/><path d="M557 412 V427" class="line"/><path d="M715 475 H760 V400 H790" class="line"/><path d="M1035 400 H1075 V262 H1110" class="line"/>
<rect x="55" y="685" width="1290" height="82" rx="16" fill="#291d2b" stroke="#8b4453" stroke-width="1.3"/>
<text x="80" y="717" font-family="system-ui" font-size="16" font-weight="700" fill="#fda4af">Security boundary</text>
<text x="80" y="743" class="body">Redaction is best-effort—not a guarantee. Crash records may contain sensitive runtime context; review before sharing or uploading.</text>
<text x="1340" y="800" text-anchor="end" class="small">CRASHLOOM · V0.1.0</text>
</svg>